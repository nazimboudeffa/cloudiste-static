services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - gpu-data:/usr/share/nginx/html/data:ro

  gpu-scan:
    build:
      context: .
      dockerfile: Dockerfile.gpu-scan
    restart: unless-stopped
    environment:
      VAST_API_KEY: ${VAST_API_KEY}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
    volumes:
      - gpu-data:/data

volumes:
  gpu-data:
